<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Radar rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1e293b" stroke-width="3"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="90" fill="url(#radarGlow)"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="#0284c7" stroke-width="2"/>

  <!-- Coordinate Crosshairs -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="#1e293b" stroke-width="2"/>
  <line x1="40" y1="256" x2="472" y2="256" stroke="#1e293b" stroke-width="2"/>

  <!-- Central Crisis Emblem: Globe & Shield -->
  <g transform="translate(136, 136)">
    <!-- Shield Outline -->
    <path d="M120 16 L208 48 C208 140 160 200 120 224 C80 200 32 140 32 48 Z" 
          fill="url(#shieldGrad)" filter="drop-shadow(0 12px 24px rgba(234, 88, 12, 0.4))"/>
    
    <!-- Inner Shield Inset -->
    <path d="M120 32 L192 58 C192 134 154 184 120 206 C86 184 48 134 48 58 Z" 
          fill="#0f172a" opacity="0.92"/>

    <!-- Globe Grid Lines inside Shield -->
    <circle cx="120" cy="116" r="54" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <ellipse cx="120" cy="116" rx="28" ry="54" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <line x1="66" y1="116" x2="174" y2="116" stroke="#38bdf8" stroke-width="3"/>
    <line x1="74" y1="90" x2="166" y2="90" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="74" y1="142" x2="166" y2="142" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Center Hazard Beacon -->
    <circle cx="120" cy="116" r="14" fill="#f43f5e"/>
    <circle cx="120" cy="116" r="7" fill="#ffffff"/>
  </g>

  <!-- Live Telemetry Ping Dots -->
  <circle cx="110" cy="160" r="8" fill="#10b981"/>
  <circle cx="390" cy="170" r="9" fill="#f59e0b"/>
  <circle cx="360" cy="360" r="11" fill="#f43f5e"/>
</svg>
